[project]
name = "adminsite"
version = "0.1.0a2"
description = "Admin panel for SQLAlchemy models, mounted into Starlette, FastAPI or Litestar."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "nimaxin", email = "nimaxin2@gmail.com" }]
keywords = [
    "admin",
    "admin panel",
    "sqlalchemy",
    "fastapi",
    "starlette",
    "litestar",
    "crud",
    "htmx",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database :: Front-Ends",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Typing :: Typed",
]
dependencies = [
    "starlette>=0.40",
    "sqlalchemy>=2.0.30",
    "jinja2>=3.1.4",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
]

[project.urls]
Homepage = "https://github.com/nimaxin/adminsite"
Repository = "https://github.com/nimaxin/adminsite"
Issues = "https://github.com/nimaxin/adminsite/issues"

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "asyncpg>=0.31.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mypy>=1.11",
    "psycopg[binary]>=3.3.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "uvicorn>=0.30",
]
docs = [
    "mkdocs<2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adminsite"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "TC", "RUF", "D"]
# Classes and functions carry the documentation, modules and packages do not,
# and a dunder says what it is by its name.
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"examples/*" = ["D"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["src/adminsite"]
