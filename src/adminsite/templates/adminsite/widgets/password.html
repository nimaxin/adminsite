{#- Never filled in, whatever the record holds or was typed before. -#}
{% import "adminsite/_password_input.html" as passwords %}
{% call passwords.box(row.input_id, wrong=row.error) %}
<input class="grow" id="{{ row.input_id }}" name="{{ row.path }}" type="password" value=""
       autocomplete="new-password"
       {% if row.field.max_length %}maxlength="{{ row.field.max_length }}"{% endif %}
       {% if row.required and row.browser_required %}required{% endif %} {{ field_attrs|default('') }}>
{% endcall %}
