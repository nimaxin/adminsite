<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · {{ title }}</title>
<link rel="stylesheet" href="{{ urls.static('adminsite.css') }}">
<script>
  try {
    const saved = localStorage.getItem("adminsite-theme");
    if (saved) document.documentElement.dataset.theme = saved;
  } catch (error) {}
</script>
</head>
<body class="flex min-h-screen items-center justify-center bg-base-200 p-4 font-sans text-sm antialiased">
  <form class="card card-border w-full max-w-sm bg-base-100" method="post" action="{{ urls.login() }}">
    {{ csrf_input | safe if csrf_input }}
    <div class="card-body">
      <h1 class="card-title">{{ title }}</h1>
      <p class="text-base-content/60">Sign in to continue.</p>

      {% if error %}
        <div role="alert" class="alert alert-error alert-soft">
          <span>{{ error }}</span>
        </div>
      {% endif %}

      <fieldset class="fieldset">
        <legend class="fieldset-legend">Username</legend>
        <input class="input w-full" id="username" name="username" autocomplete="username" autofocus>
      </fieldset>
      <fieldset class="fieldset">
        <legend class="fieldset-legend">Password</legend>
        <input class="input w-full" id="password" name="password" type="password"
               autocomplete="current-password">
      </fieldset>
      <button class="btn btn-primary mt-2" type="submit">Sign in</button>
    </div>
  </form>
</body>
</html>
