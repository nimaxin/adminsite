{%- set types = {"datetime": "datetime-local", "date": "date", "time": "time", "email": "email"} -%}
<input class="input w-full {% if row.error %}input-error{% endif %}"
       id="field-{{ row.path }}" name="{{ row.path }}" value="{{ row.value }}"
       type="{{ types.get(row.widget, 'text') }}"
       {% if row.widget == "number" %}inputmode="decimal"{% endif %}
       {% if row.field.max_length %}maxlength="{{ row.field.max_length }}"{% endif %}
       {% if row.required and row.browser_required %}required{% endif %} {{ field_attrs|default('') }}>
