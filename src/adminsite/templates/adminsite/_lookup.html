<ul class="menu menu-sm w-full p-0">
  {% for choice in choices %}
    <li>
      <button type="button"
              @click="$refs.key.value = '{{ choice.value }}'; label = {{ choice.label|tojson }}; open = false">
        {{ choice.label }}
      </button>
    </li>
  {% else %}
    <li class="menu-disabled"><span>{{ _('Nothing found.') }}</span></li>
  {% endfor %}
</ul>
