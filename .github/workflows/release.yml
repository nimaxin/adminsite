name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest -q
      # The package carries the docs' whole guide for coding agents, built
      # from this commit, so it always matches the version it installs.
      - run: uv run --group docs mkdocs build --strict
      - run: cp site/llms-full.txt src/adminsite/llms-full.txt
      - run: uv build
      - run: uv run python .github/check_guide.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    # Trusted publishing: PyPI trusts this workflow, so there is no token
    # to keep anywhere.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    # The release sits beside the tag, so the repository page names the same
    # version PyPI has, and people who watch releases hear of it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Write the notes from the changelog
        run: python .github/release_notes.py "$GITHUB_REF_NAME" > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          kind=""
          case "$version" in
            *[0-9]a[0-9]* | *[0-9]b[0-9]* | *rc[0-9]*) kind="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" --verify-tag $kind \
            --title "adminsite $version" --notes-file notes.md
