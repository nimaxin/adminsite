<ul class="menu menu-sm w-full p-0">
  {% for choice in choices %}
    <li>
      {#- Single quotes, because a record's name may hold a double quote. -#}
      <button type="button" @click='choose({{ choice.value|tojson }}, {{ choice.label|tojson }})'>
        {{ choice.label }}
      </button>
    </li>
  {% else %}
    <li class="menu-disabled"><span>{{ _('Nothing found.') }}</span></li>
  {% endfor %}
</ul>
