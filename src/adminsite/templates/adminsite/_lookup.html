{% for choice in choices %}
  <button class="flex w-full items-center rounded px-2 py-1.5 text-left text-sm hover:bg-surface"
          type="button"
          @click="$refs.key.value = '{{ choice.value }}'; label = {{ choice.label|tojson }}; open = false">
    {{ choice.label }}
  </button>
{% else %}
  <p class="px-2 py-1.5 text-sm text-muted">Nothing found.</p>
{% endfor %}
